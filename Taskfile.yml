version: '3'

tasks:
  default:
    desc: List the tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: Create the virtualenv and install the package
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -e .

  test:
    desc: Run the test suite
    cmds:
      - .venv/bin/python -m unittest discover -s tests -v
