# =============================================================================
# personal-template / core Taskfile
# =============================================================================
# Language-neutral quality machinery: docs freshness, toolchain floor,
# aggregate audit, release driver, GitHub settings. Language-specific tasks
# (lint / test / build / run) are intentionally thin — every one of them runs
# through `uv run`, which builds the environment (.venv from .python-version
# and uv.lock) the first time, so there is no setup step. A `Taskfile.local.yml`
# include is honoured if you prefer keeping your stack's tasks separate.
# =============================================================================

version: '3'

includes:
  local:
    taskfile: ./Taskfile.local.yml
    optional: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Stack tasks — keeping the task names stable means every derived repo
  # answers to the same verbs regardless of language. Define more in
  # Taskfile.local.yml, which is included when present.
  # ---------------------------------------------------------------------------
  update:
    desc: Move every dependency to the newest version the constraints allow, and rewrite uv.lock
    cmds:
      - uv sync --upgrade

  lint:
    desc: Compile every source file (= the syntax gate this repo declares; no linter is configured)
    cmds:
      - uv run python -m compileall -q src preview/src

  lint:lock:
    desc: Fail when uv.lock does not match pyproject.toml (= a changed dependency was not locked)
    cmds:
      - uv lock --check

  test:unit:
    desc: Run the toolkit's own suite
    cmds:
      - uv run python -m unittest discover -s tests -v

  test:integration:
    desc: Run the vendored preview's suite (= server, cache and notes against real files)
    cmds:
      - uv run python -m pytest preview/tests -q

  build:
    desc: Build the wheel and the source archive
    cmds:
      # PEP 517 の標準の口。wheel だけでは、pyproject が宣言した file が本当に
      # 配られるかを誰も見ていない (= sdist はそれを組み立てる側から確かめる)。
      - uv run python -m build --outdir dist .

  run:
    desc: Show the toolkit's commands
    cmds:
      - uv run python -m pptx_agent_maker --help

  preview:
    desc: Watch a project's built decks in a browser
    cmds:
      - uv run python -m pptx_agent_maker preview {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # Language-neutral quality gates (no delegation).
  # ---------------------------------------------------------------------------
  ci:
    desc: Full quality-gate suite (lint + tests + docs freshness + version drift) — same entry point locally and in CI
    cmds:
      - task: lint
      - task: lint:lock
      - task: test:unit
      - task: docs:check
      - task: lint:versions

  publish:check:
    desc: Pre-publication gate for flipping a repo private -> public (full-history audits + OSS surface checks)
    cmds:
      - bash .tooling/local-ci/publish-check.sh

  docs:check:
    desc: Verify docs freshness (paths / task names / tree diagrams vs reality)
    cmds:
      - bash .tooling/local-ci/docs-check.sh

  doctor:
    desc: Full diagnostic — toolchain floor + hooks/machine armament in one pass
    cmds:
      - bash .tooling/local-ci/doctor.sh
      - if [ -f "$HOME/.git-hooks/doctor.sh" ]; then bash "$HOME/.git-hooks/doctor.sh"; else echo "guard-dispatcher not armed on this machine (machine-wide hooks missing)"; fi

  pr:create:
    desc: Create a GitHub PR with the title/body anon-scanned first (TITLE= BODY_FILE= [BASE=main], needs guard-dispatcher)
    cmds:
      - bash "$HOME/.git-hooks/scripts/pr-create.sh" --title "{{.TITLE}}" --body-file "{{.BODY_FILE}}" --base "{{.BASE | default "main"}}"

  lint:versions:
    desc: Detect downstream toolchain drift vs .tooling/versions.yaml truth
    cmds:
      - bash .tooling/local-ci/lint-versions.sh

  gen-notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the installed dep tree (python + node)
    cmds:
      - uv run --with pip-licenses python scripts/generate/gen-third-party-notices.py

  specimen:
    desc: Re-bake the specimen and picture the project template ships with (after a token change)
    cmds:
      - uv run python scripts/generate/bake-template.py

  snapshot:
    desc: Bake the corpus and rewrite the slide XML kept under tests/corpus/snapshot (= after a change meant to move a page)
    cmds:
      - uv run python scripts/check/snapshot.py

  snapshot:check:
    desc: Bake the corpus and compare it with the slide XML that is kept (= a refactor leaves every byte as it was)
    cmds:
      - uv run python scripts/check/snapshot.py --check

  mutate:
    desc: Break the code the ways a table lists and see the tests go red (= task mutate -- tests/mutants/_example.toml)
    cmds:
      - uv run python scripts/check/mutate.py {{.CLI_ARGS}}

  audit:
    desc: Aggregate security audit (anon-scan + gitleaks full history + pip-audit + npm audit)
    cmds:
      - bash .tooling/local-ci/audit.sh

  audit:deep:
    desc: Deep anon audit across 11 sources (needs guard-dispatcher armed on this machine)
    cmds:
      - bash "$HOME/.git-hooks/scanners/anon-audit-deep.sh"

  clean:
    desc: Clean build artefacts + caches (auto-detects present stacks; LAYER=<stack>|docs|all narrows)
    vars:
      LAYER: '{{.LAYER | default "all"}}'
    cmds:
      - bash .tooling/local-ci/clean.sh {{.LAYER}}

  version:bump:
    desc: Bump version in bump-targets.yaml + listed files (LEVEL=patch|minor|major, DRY_RUN=1 for plan-only)
    vars:
      LEVEL: '{{.LEVEL | default "patch"}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - LEVEL={{.LEVEL}} DRY_RUN={{.DRY_RUN}} bash .tooling/local-ci/version-bump.sh

  release:cut:
    desc: Bump version + commit + tag + push (LEVEL=patch|minor|major, SKIP_PUSH=1 to keep local, DRY_RUN=1 for plan-only)
    vars:
      LEVEL: '{{.LEVEL | default "patch"}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      SKIP_PUSH: '{{.SKIP_PUSH | default "0"}}'
    cmds:
      - LEVEL={{.LEVEL}} DRY_RUN={{.DRY_RUN}} SKIP_PUSH={{.SKIP_PUSH}} bash .tooling/local-ci/release-cut.sh

  setup:branch-protection:
    desc: Setup branch protection rules for the main branch
    cmds:
      - bash scripts/github/setup-branch-protection.sh

  init:github:
    desc: Apply post-template GitHub settings (= secret scanning, PVR, merge config, branch protection)
    vars:
      OWNER: '{{.OWNER | default ""}}'
      REPO: '{{.REPO | default ""}}'
    cmds:
      - OWNER={{.OWNER}} REPO={{.REPO}} bash scripts/github/post-init-github-settings.sh
