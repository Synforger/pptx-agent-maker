version: '3'

tasks:
  default:
    desc: List the tasks
    cmds: [task --list]
    silent: true

  setup:
    desc: Create the virtualenv and install the package (with the preview)
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -e .
      - .venv/bin/pip install -q -e preview

  preview:
    desc: Watch a project's built decks in a browser
    cmds:
      - .venv/bin/python -m pptx_agent_maker preview {{.CLI_ARGS}}

  test:
    desc: Run the test suite
    cmds:
      - .venv/bin/python -m unittest discover -s tests -v
