# The corpus: one made-up project that uses every page type and every look once.
# scripts/check/snapshot.py copies it outside the repository, builds each manifest,
# and keeps the slide XML under snapshot/ — so a refactor can be told from a change.

root = "."

[paths]
assets = "assets"

# Grounds named for what they mean: two light ones, one in Japanese, one dark.
[theme.grounds]
"Inside" = "EAF0F8"
"Outside" = "FFF4E5"
"共通" = "E8F3EA"
"Late" = "8B1E3F"

# A use of the project's own (= named here, picked by a deck or a page with `use = "detail"`).
[theme.uses.detail]
like = "read"
heading = 14
body = 11

# A use that sets the size of the bands and of the big number apart from the headings.
[theme.uses.banded]
like = "read"
heading = 12
body = 11
band = 16
display = 40

# A use whose gaps are wide enough to hold words beside an arrow (= a sideways arrow's words stand in the gap).
[theme.uses.airy]
like = "read"

[theme.uses.airy.spacing]
gap_m = 2.5

# A use that sets its own floor and spacing (= like the toolkit's sheet, tighter still).
[theme.uses.proposal]
like = "sheet"
floor = 7
body = 8
caption = 7

[theme.uses.proposal.spacing]
scale = 0.5
pad = 0.1

# A use whose bands are a height of their own, not the height of the type in them: the band over a page and
# the one under it are not alike.
[theme.uses.ruled]
like = "read"
band = 14

[theme.uses.ruled.spacing]
band_height = 1.5
conclusion_height = 0.9

# Uses that pick how tall their boxes stand, whatever the deck says (= this deck's boxes are as tall as their words).
[theme.uses.filled]
like = "read"
box_height = "page"

[theme.uses.centred]
like = "read"
box_height = "middle"

# A use that sizes a tag apart from the headings of the cards beside it, and sets its tables in the plain look
# (= this deck's tables have a heading row on the accent).
[theme.uses.tagged]
like = "read"
heading = 10.5
tag = 14
table_look = "plain"

# A use whose cells stand far apart across a row and close together down the page (= `gap_x` between the cells
# of a row, `gap_y` between the rows, `band_gap` between a band and the body; a use that says only `gap_m` sets all
# three).
[theme.uses.apart]
like = "read"

[theme.uses.apart.spacing]
gap_x = 1.6
gap_y = 0.15
band_gap = 1.0

# A use whose small words above a title are set larger than the captions (= the row they stand in grows with them).
[theme.uses.headed]
like = "read"
kicker = 13

# The pictures here are made up to exercise the layout, so there is no source to name:
# the corpus builds with the check for unsourced pages switched off, the way a project may.
[checks]
stale_words = ["案件名", "第 N 回"]
unsourced = false
