[[pages]]
kind = "declare"
type = "timeline"
kicker = "03 | 計画"
title = "半期の計画を、期間とレーンで読む"
periods = ["4月", "5月", "6月", "7月", "8月", "9月"]
phases = [{ from = 0, to = 6, label = "上期" }]
milestones = [{ at = 0.5, text = "開始" }, { at = 6, text = "報告会" }]
table = [["レーン", "担当"], ["設計", "A"], ["試験", "B"]]
note = "表は線表の下に置かれる"
conclusion = "6 月までに試作を終える"
footer = "出所: 見本のための作り物"

[[pages.lanes]]
name = "設計と、その後の見直しまで"
bars = [
  { from = 0, to = 2.5, text = "要件をまとめる" },
