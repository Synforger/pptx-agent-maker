  { from = 3, to = 6, text = "見直し", icon = "circle.png" },
]

[[pages.lanes]]
name = "試験"
bars = [
  { from = 1.5, to = 2, text = "準備" },
  { from = 2, to = 5.5, text = "測って、結果を表にまとめる" },
]
marks = [{ at = 5.75, text = "完了" }]

