# What a timeline does with a crowded page: rows, names beside a bar, dates that cut
# across, bars across lanes, and the smaller of its two type sizes.

specimen = "specimen.pptx"
out = "timeline.pptx"

[[pages]]
kind = "declare"
type = "timeline"
title = "Phases above, dates across, bars that overlap in time"
condition = "The first quarter can slide; the second is fixed"
periods = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"]
phases = [
  { from = 0, to = 3, label = "flexible" },
  { from = 3, to = 6, label = "fixed deadlines" },
]
milestones = [
  { at = 2.5, text = "Review" },
  { at = 2.9, text = "Freeze" },
  { at = 5.6, text = "Expo" },
]

[[pages.lanes]]
name = "Core"
bars = [
  { from = 0, to = 2, text = "build" },
  { from = 1, to = 3, text = "test what was built" },
  { from = 3, to = 3.5, text = "a name too long for its bar" },
  { from = 4, to = 6, text = "harden" },
]
marks = [{ at = 1, text = "0.9" }, { at = 6, text = "1.0" }]

[[pages.lanes]]
name = "Docs"
bars = [
  { from = 0, to = 1, text = "outline of the whole guide" },
  { from = 5.5, to = 6, text = "print" },
  { from = 2, to = 5, text = "write" },
]

[[pages.lanes]]
name = "Marks only"
marks = [{ at = 0, text = "start" }, { at = 3, text = "half way" }]

[[pages]]
kind = "declare"
type = "timeline"
title = "Bars across lanes"
periods = ["Nov", "Dec", "Jan", "Feb", "Mar"]
milestones = [{ at = 5, text = "Launch" }]

[[pages.lanes]]
name = "Core: inside"
bars = [
  { from = 0, to = 3, text = "build the core", spans = 2 },
  { from = 3, to = 5, text = "manual" },
]

[[pages.lanes]]
name = "Core: outside"
bars = [{ from = 3, to = 5, text = "demo" }]

[[pages.lanes]]
name = "Docs"
tone = "tint"
bars = [
  { from = 0, to = 1, text = "outline" },
  { from = 1, to = 2, text = "a name that needs every lane it covers to fit inside", spans = 3, tentative = true },
  { from = 2, to = 4, text = "write" },
]
marks = [{ at = 4.5, text = "print" }]

[[pages.lanes]]
name = "Covered only"

[[pages.lanes]]
name = "Site"
bars = [{ from = 2, to = 5, text = "publish" }]

[[pages]]
