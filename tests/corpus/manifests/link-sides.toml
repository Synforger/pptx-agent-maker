# The edges a link is written to leave and enter by (= `out` and `in`): lines that leave one edge together by one
# trunk and parting along a cross line, lines that enter one edge together joining before they go in, and words on a
# bent line standing beside its first run.

specimen = "specimen.pptx"
out = "link-sides.pptx"

[[pages]]
kind = "declare"
type = "compose"
title = "A flow chart in two columns, its lines written to leave and enter by edges"
use = "flowing"
links = [
  { from = "Start", to = "QA" },
  { from = "QA", to = "DocA", text = "Yes", out = "left", in = "top" },
  { from = "QA", to = "QB", text = "No", out = "right", in = "top" },
  { from = "QB", to = "DocA", text = "Yes", out = "left", in = "top" },
  { from = "QB", to = "DocB", text = "No", out = "bottom", in = "top" },
  { from = "DocA", to = "Q1", out = "bottom", in = "top" },
  { from = "DocB", to = "Q1", out = "bottom", in = "top" },
  { from = "Q1", to = "Add1", text = "Yes" },
  { from = "Q1", to = "Q2", text = "No" },
  { from = "Q2", to = "Add2", text = "Yes" },
  { from = "Q2", to = "Q3", text = "No" },
  { from = "Q3", to = "Add3", text = "Yes" },
  { from = "Q3", to = "Q4", text = "No" },
