# A page on a grid: cells at a row and a column, a cell that spans two rows, backdrops laid under them for the bands of
# a flow across departments, and the legend of the grounds in an empty cell. An arrow between two boxes that face each
# other is straight, and one between two that do not bends once. A second page has a dotted arrow and a dotted box, and
# the legend ends with the sample of the dotted line and its words.

specimen = "specimen.pptx"
out = "grid.pptx"

[[pages]]
kind = "declare"
type = "compose"
title = "Two bands on a grid, with the boxes that stand over both of them"
condition = "Each department has a band under its row; what both of them meet stands across the two rows"
conclusion = "An arrow bends once where the two boxes it joins do not face each other"
grid = { columns = [2.2, 3, 3, 3, 3], rows = [1, 1] }
links = [
  { from = "device", to = "build", tone = "accent" },
  { from = "build", to = "use" },
  { from = "use", to = "hub" },
]

[[pages.backdrops]]
at = [1, 1]
span = [1, 5]
tone = "Inside"

[[pages.backdrops]]
at = [2, 1]
span = [1, 5]
tone = "Outside"

[[pages.cells]]
at = [1, 1]
text = "Users"
role = "label"

[[pages.cells]]
at = [2, 1]
text = "Developers"
role = "label"

[[pages.cells]]
at = [1, 2]
span = [2, 1]
id = "device"
card = { heading = "The device", body = "What both of them hold", tone = "共通" }

[[pages.cells]]
at = [1, 3]
legend = true

[[pages.cells]]
at = [2, 3]
id = "build"
card = { heading = "Build", body = "A developer writes it" }

[[pages.cells]]
at = [1, 4]
id = "use"
card = { heading = "Use", body = "A user reaches for it", tone = "Inside" }

[[pages.cells]]
at = [1, 5]
span = [2, 1]
id = "hub"
card = { heading = "Where they meet", body = "Over both rows, on a ground of its own", tone = "Late" }

[[pages]]
kind = "declare"
type = "compose"
title = "A flow in two stages, the second one only a plan"
condition = "A dotted arrow and a dotted box are the stage that is not decided yet"
conclusion = "The legend ends with a sample of the dotted line and what it means"
grid = { columns = [1, 1, 1], rows = [1] }
legend = true
dotted_legend = "Planned flow"
links = [
  { from = "now", to = "next" },
  { from = "next", to = "later", tentative = true },
]

[[pages.cells]]
at = [1, 1]
id = "now"
card = { heading = "Now", body = "What runs today", tone = "Inside" }

[[pages.cells]]
at = [1, 2]
id = "next"
card = { heading = "Next", body = "What is built this quarter", tone = "Outside" }

[[pages.cells]]
at = [1, 3]
id = "later"
card = { heading = "Later", body = "Not decided yet", tone = "Late", tentative = true }
