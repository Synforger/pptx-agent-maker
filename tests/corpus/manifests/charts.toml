# Charts drawn from their numbers: the five kinds, and every key a chart reads.

specimen = "specimen.pptx"
out = "charts.pptx"

[[pages]]
kind = "declare"
type = "chart"
title = "A column chart: one category stands out, the rest are grey"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "column"
categories = ["Q1", "Q2", "Q3", "Q4"]
series = [{ name = "Share", values = [12.5, 15, 21.25, 18] }]
highlight = "Q3"
unit = "%"

[[pages]]
kind = "declare"
type = "chart"
title = "A bar chart read from a file: one series stands out, and the legend names all three"
footer = "Source: regions.csv"

[pages.chart]
kind = "bar"
data = "regions.csv"
highlight = "South"
highlight_tone = "good"

[[pages]]
kind = "declare"
type = "chart"
kicker = "01 | 推移"
title = "折れ線は移り変わりを見せる。数字を付けなければ、値の軸が出る"
note = "系列の色を書かなければ、最初の系列が差し色で、続きは灰"

[pages.chart]
kind = "line"
categories = ["1 月", "2 月", "3 月", "4 月", "5 月", "6 月"]
labels = false
series = [
  { name = "今年", values = [120, 135, 150, 148, 170, 190] },
  { name = "去年", values = [110, 115, 118, 130, 128, 140] },
]

[[pages]]
kind = "declare"
type = "chart"
title = "Stacked columns: each series in a tone of its own, the numbers inside"

[pages.chart]
kind = "stacked"
categories = ["2023", "2024", "2025"]
series = [
  { name = "Core", values = [40, 45, 52], tone = "accent" },
  { name = "Demo", values = [20, 28, 30], tone = "Outside" },
  { name = "Late", values = [5, 12, 4], tone = "Late" },
]

[[pages]]
kind = "declare"
type = "chart"
title = "A waterfall: steps up and down between two totals"
conclusion = "The steps add up to the total at the end"

[pages.chart]
kind = "waterfall"
categories = ["Last year", "New customers", "Price", "Churn", "Costs", "This year"]
series = [{ name = "Profit", values = [100, 42, 8.5, -30, -12.5, 108] }]
totals = ["Last year", "This year"]
unit = "M"

[[pages]]
kind = "declare"
type = "compose"
title = "A chart in a cell, beside the words that read it"

[[pages.rows]]
[[pages.rows.cells]]
weight = 2
[pages.rows.cells.chart]
kind = "column"
categories = ["A", "B", "C"]
series = [{ name = "Score", values = [3, 7, 5] }]
highlight = "B"
[[pages.rows.cells]]
card = { heading = "B leads", body = "by two points over C" }

[[pages]]
kind = "declare"
type = "chart"
title = "Callouts: a few words above the point they mean, and a thin line down to it"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "column"
categories = ["Q1", "Q2", "Q3", "Q4"]
series = [
  { name = "North", values = [12, 15, 21, 18] },
  { name = "South", values = [8, 9, 14, 16] },
]
highlight = "North"
callouts = [
  { at = "Q3", series = "North", text = "the new product" },
  { at = "Q1", series = "South", text = "a slow start" },
]

[[pages]]
kind = "declare"
type = "chart"
kicker = "02 | 注記"
title = "数字を付けない折れ線にも注記は付く。値の軸の字のぶん、描く範囲が右へ寄る"
note = "注記を持つグラフは、描く範囲と値の軸を道具が決めて書き出す"

[pages.chart]
kind = "line"
categories = ["1 月", "2 月", "3 月", "4 月", "5 月", "6 月"]
labels = false
series = [
  { name = "今年", values = [120, 135, 150, 148, 170, 190] },
  { name = "去年", values = [110, 115, 118, 130, 128, 140] },
]
callouts = [{ at = "4 月", series = "今年", text = "一度下がった" }]

[[pages]]
kind = "declare"
type = "chart"
title = "On a bar chart the words stand to the right, level with their bar"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "bar"
categories = ["Alpha team", "Beta", "Gamma"]
series = [{ name = "Score", values = [12, 30, 21] }, { name = "Target", values = [20, 25, 22] }]
unit = " pt"
callouts = [
  { at = "Beta", series = "Score", text = "above target" },
  { at = "Alpha team", series = "Target", text = "missed" },
]

[[pages]]
kind = "declare"
type = "chart"
title = "A stacked column and a waterfall are pointed at one column at a time"
conclusion = "Which part is meant is said in the words"

[pages.chart]
kind = "waterfall"
categories = ["Last year", "New customers", "Churn", "This year"]
series = [{ name = "Profit", values = [100, 42, -30, 112] }]
totals = ["Last year", "This year"]
callouts = [{ at = "Churn", text = "two accounts left" }, { at = "This year", text = "up 12" }]

[[pages]]
kind = "declare"
type = "chart"
title = "Points: how one quantity moves with another"
footer = "made up for the corpus"
why = "a chart of points, with both axes named"

[pages.chart]
kind = "scatter"
x = "Hours spent"
y = "Score"
highlight = "With the guide"
series = [
  { name = "With the guide", points = [[1, 2.5], [2, 3.5], [3.5, 5]] },
  { name = "Without", points = [[1.5, 1], [4, 2], [5, 2.5]] },
]

[[pages]]
kind = "declare"
type = "chart"
title = "A rating on a scale of five: the axis runs 1 to 5 with a line at every step, and the numbers stay on the bars"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "column"
categories = ["A", "B", "C", "D"]
series = [{ name = "Average of five", values = [4.53, 4.31, 4.18, 3.49] }]
scale = { from = 1, to = 5, step = 1 }

[[pages]]
kind = "declare"
type = "chart"
title = "Numbers close together with the axis hidden: the bars still stand from zero"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "column"
categories = ["A", "B", "C"]
series = [{ name = "Score", values = [75, 75, 67] }]

[[pages]]
kind = "declare"
type = "compose"
title = "Bare bars: no numbers and no value axis, only the heights and the names under them"
footer = "Source: the numbers written on this page"

[[pages.rows]]
[[pages.rows.cells]]
text = "North"
[[pages.rows.cells]]
chart = { kind = "column", bare = true, categories = ["2022", "2023", "2024", "2025"], series = [{ name = "Papers", values = [4, 9, 15, 11] }], highlight = "2024" }
[[pages.rows.cells]]
chart = { kind = "column", bare = true, categories = ["2022", "2023", "2024", "2025"], series = [{ name = "Papers", values = [75, 75, 67, 70] }] }
[[pages.rows.cells]]
chart = { kind = "bar", bare = true, categories = ["Lab", "Field", "Model"], series = [{ name = "Papers", values = [8, 3, 5] }] }

[[pages]]
kind = "declare"
type = "chart"
title = "A line of words under the name of each bar: where the numbers came from"
footer = "Source: the numbers written on this page"

[pages.chart]
kind = "bar"
categories = ["Street scenes", "Product shots", "Portraits", "Indoor rooms", "Night views", "Maps", "Sketches"]
series = [{ name = "Images", values = [120000, 84000, 52000, 30000, 12000, 6000, 2400] }]
notes = ["from a public archive", "white background", "faces blurred", "mixed lighting", "low light", "", "hand drawn, scanned"]
unit = " k"

[[pages]]
kind = "declare"
type = "chart"
title = "Points that carry their names, on a light grid"
footer = "made up for the corpus"
why = "a scatter whose points say what they are and what they came to, read against a grid"

[pages.chart]
kind = "scatter"
x = "Hours spent"
y = "Score"
grid = true
series = [
  { name = "With the guide", points = [[1, 2.5, "Alpha study"], [2, 3.5, "Beta study"], [3.5, 5, "Gamma"]] },
  { name = "Without", points = [[1.5, 1], [4, 2, "Delta"], [5, 2.5]] },
]

[[pages]]
kind = "declare"
type = "chart"
title = "A strip: a row for each kind, a mark for each file, the median of a row ringed"
footer = "made up for the corpus"
why = "points on a log axis, one row to a category, with the median of each row and a line beside it"

[pages.chart]
kind = "strip"
axis = "log"
ticks = [1, 10, 100, 1000, 10000]
median = true
highlight = "Small"
categories = ["Street scenes\nphotographs", "Product shots\nstudio\nwhite background", "Portraits\nfaces blurred", "Night views\nlow light"]
notes = ["1,200 files", "340 files", "88 files", "2,000 files"]
series = [
  { name = "Small", values = [[93.7, 340.5, 560.1, 166.1, 86.1, 238.3, 369.2, 608.6, 94.3, 88.6, 443.7], [92.5, 217.2, 139.3, 58.1, 50.6, 500.8, 50], [84.2, 63.3, 171.2, 178.2, 120], [23.9, 31.3, 43.9, 60.8, 29.7, 5.9, 44.2, 8, 21.9]] },
  { name = "Medium", values = [[242.2, 795.7, 424.1, 943.8], [2851.7, 191.9, 393.4, 68.7, 158.2, 340.3], [], [73.7, 107, 86.3]] },
  { name = "Large", values = [[], [559.6, 1982.9], [260.5, 2265.2, 333.6], []] },
]

[[pages]]
kind = "declare"
type = "compose"
title = "A strip in a cell, its series in tones of their own and the legend left to the page beside it"

[[pages.rows]]
[[pages.rows.cells]]
weight = 3
[pages.rows.cells.chart]
kind = "strip"
axis = "log"
ticks = [0.1, 1, 10, 100]
legend = false
categories = ["Lab", "Field"]
series = [
  { name = "Before", tone = "accent", values = [[0.3, 0.8, 2.5, 4], [1.2, 6, 9]] },
  { name = "After", tone = "bad", values = [[5, 22, 40], [30, 75]] },
]
[[pages.rows.cells]]
weight = 1
card = { heading = "Before is blue", body = "After is orange" }

[[pages]]
kind = "declare"
type = "chart"
title = "Bars below zero keep their names at the outer edge, clear of the bars and their numbers"
footer = "made up for the corpus"
[pages.chart]
kind = "bar"
x = "Change in AP (points)"
categories = ["car", "pedestrian", "traffic_cone", "bicycle"]
series = [{ name = "Change", values = [0.0013, -0.0063, -0.0008, 0.002] }]

[[pages]]
kind = "declare"
type = "chart"
title = "Both axes say what they are, and the value axis keeps its name with the numbers on the bars"
footer = "made up for the corpus"
[pages.chart]
kind = "column"
x = "Quarter"
y = "Orders (units)"
categories = ["Q1", "Q2", "Q3", "Q4"]
series = [{ name = "Orders", values = [12, 15, 21, 18] }]

[[pages]]
kind = "declare"
type = "chart"
title = "A chart the toolkit holds keeps a line under its plot and a line beside it for the names of its axes"
footer = "made up for the corpus"
[pages.chart]
kind = "column"
x = "Month"
y = "Balance (k$)"
categories = ["Apr", "May", "Jun", "Jul"]
series = [{ name = "Balance", values = [12, 30, -21, 8] }]
callouts = [{ at = "May", text = "the peak" }]
