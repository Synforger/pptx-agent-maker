# The sizes of the type come by name: a deck names its use, and a page inside it names another
# (= a page to be read, in the middle of a deck made to be shown).

specimen = "specimen.pptx"
out = "uses.pptx"
use = "present"

[[pages]]
kind = "declare"
type = "cards"
title = "A deck made to be shown says little on a page"
card_columns = 2
cards = [
  { heading = "Large", body = "read from a seat" },
  { heading = "Few", body = "the points only" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "read"
title = "One page to be read, in the middle of it"
card_columns = 3
cards = [
  { heading = "One", body = "the sizes of a deck read at a desk" },
  { heading = "Two", body = "so the page holds what a shown page cannot" },
  { heading = "Three", body = "the band of the title is as tall as its type" },
  { heading = "Four", body = "nothing else about the deck changes" },
  { heading = "Five", body = "its colours and its typeface stay" },
  { heading = "Six", body = "and the next page is large again" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "detail"
title = "A page in a use the project named for itself"
card_columns = 3
cards = [
  { heading = "Named", body = "under [theme.uses] of the project" },
  { heading = "Like", body = "it starts from a use of the toolkit" },
  { heading = "Changed", body = "and says only the sizes it changes" },
]

[[pages]]
kind = "declare"
type = "cards"
title = "The deck's own use again"
card_columns = 2
cards = [
  { heading = "Back", body = "to the sizes of the deck" },
  { heading = "Same", body = "as the first page" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "sheet"
title = "One sheet to be read close up"
card_columns = 3
cards = [
  { heading = "Smaller", body = "three quarters of a deck read at a desk" },
  { heading = "Tighter", body = "and what stands round the type by the same ratio" },
  { heading = "More", body = "so the page holds what a proposal on one sheet says" },
  { heading = "Edge", body = "the edge of the page stays where the deck has it" },
  { heading = "Lines", body = "and its lines stay as thin as they were" },
  { heading = "Floor", body = "nothing on it is under eight points" },
]
table = [["Item", "Cost", "When"], ["Design", "1", "week 1"], ["Build", "3", "weeks 2 to 4"], ["Review", "1", "week 5"]]
note = "The rows of a table follow: a line of type and the padding of its cells."
footer = "source: made up for the corpus"

[[pages]]
kind = "declare"
type = "cards"
use = "proposal"
title = "A use that sets a floor and a spacing of its own"
card_columns = 4
cards = [
  { heading = "Floor", body = "seven points, said by the project" },
  { heading = "Scale", body = "half the spacing of a deck to be read" },
  { heading = "Pad", body = "and one distance written by itself" },
  { heading = "Name", body = "a page picks all of it by one name" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "banded"
title = "The band is set apart from the heading of a card"
condition = "Headings are 12 points; this band stays at 16"
conclusion = "The band's height follows the size it is set in"
card_columns = 3
cards = [
  { heading = "Heading", body = "twelve points, as the use says" },
  { heading = "Band", body = "sixteen points, said on its own" },
  { heading = "Height", body = "taken from the band, not from the heading" },
]

[[pages]]
kind = "declare"
type = "compose"
use = "banded"
title = "The big number is set apart from the title"

[[pages.rows]]
[[pages.rows.cells]]
text = "48"
role = "display"
[[pages.rows.cells]]
weight = 2
card = { heading = "Display", body = "forty points, said by the use" }

[[pages]]
kind = "declare"
type = "cards"
use = "ruled"
title = "A band is as tall as its use says, the one over a page and the one under it apart"
condition = "This band is 1.5 cm tall at 14 points"
conclusion = "This one is 0.9 cm, whatever the type in it"
card_columns = 3
cards = [
  { heading = "Over", body = "the band of a condition" },
  { heading = "Under", body = "the band of a conclusion" },
  { heading = "Apart", body = "each says its own height" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "filled"
title = "A use whose boxes take the page, in a deck whose boxes do not"
card_columns = 1
cards = [
  { heading = "Page", body = "the boxes share the height of the body" },
  { heading = "Use", body = "said by the use, not by the deck" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "centred"
title = "A use whose boxes stand in the middle of the body"
condition = "The boxes are as tall as their words"
conclusion = "What is left of the body is above them and below them alike"
card_columns = 1
cards = [
  { heading = "Middle", body = "the cards as one block, in the middle of the body" },
  { heading = "Gaps", body = "the gaps between the cards are the ones there always were" },
  { heading = "Bands", body = "the bands and the title stay where they are" },
]

[[pages]]
kind = "declare"
type = "cards"
use = "tagged"
title = "A tag is set larger than the headings of the cards beside it"
condition = "Headings are 10.5 points; the tags are 14"
card_columns = 3
cards = [
  { heading = "Stage 1", tag = true, tone = "accent" },
  { heading = "Stage 2", tag = true, tone = "bad" },
  { heading = "Stage 3", tag = true, tone = "good" },
  { heading = "First", body = "the heading is as small as the use says", tone = "accent" },
  { heading = "Second", body = "and the tag above it is not", tone = "bad" },
  { heading = "Third", body = "the height of a tag follows its own size", tone = "good" },
]

[[pages]]
kind = "declare"
type = "board"
use = "tagged"
title = "A use sets its tables in a look of its own"
table = [
  ["Bed", "Planted", "Yield"],
  { band = "Spring", tone = "accent" },
  ["North", "12 Mar", "48 kg"],
  ["South", "30 Mar", "71 kg"],
]
note = "The deck's tables have a heading row on the accent; this use's are plain"
footer = "made up for the corpus"
