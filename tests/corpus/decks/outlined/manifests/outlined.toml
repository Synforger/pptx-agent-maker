# What a deck of outlined cards does to a card: the colour goes to the line and the heading, the words stand
# in the middle of the box, a card may leave its heading or its body out, a tag is a label on pale grey.
# A table is plain: a grey heading row, no stripes, grey rules; a band divides it in whatever tone it asks for.

specimen = "specimen.pptx"
out = "outlined.pptx"

[[pages]]
kind = "declare"
type = "cards"
title = "Every way to fill an outlined card"
condition = "A colour is on the line and on the heading; the words are in the middle"
conclusion = "A card with only its heading stands in the middle just the same"
card_columns = 3
cards = [
  { heading = "Both", body = "a heading and a body", tone = "accent" },
  { body = "only the words of the card", tone = "bad" },
  { heading = "Only a heading", tone = "good" },
  { heading = "Stage 1", tag = true, tone = "bad" },
  { heading = "Centred", body = "heading and body, set to the middle", align = "center", tone = "accent" },
  { body = ["the first bullet", "a second bullet, long enough to wrap onto another line of its card", "the third"], tone = "tint" },
  { heading = "Open", body = "not decided yet", tentative = true },
  { heading = "On a named ground", body = "kept in house", tone = "Inside", strong = true },
  { tone = "band" },
]

