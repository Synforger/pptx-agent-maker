# A second made-up project, whose look is the one `[theme]` sets for a whole deck: outlined cards and bands,
# plain tables, and boxes that fill the page. The main corpus keeps the default look, and the look of a deck is one per
# project, so what the outlined look does to a page is kept from here (= snapshot.py bakes it in a project of
# its own; the pictures and recipes are the corpus's).

root = "."

[paths]
assets = "assets"

[theme]
card_look = "outlined"
bar_look = "outlined"
tentative_look = "toned"
band_look = "outlined"
table_look = "plain"
box_height = "page"

# A use whose gaps are tall enough for a line of words beside a downward arrow.
[theme.uses.gapped]
like = "read"

[theme.uses.gapped.spacing]
gap_m = 1.0

# A use whose tables have a heading row on the accent, in a deck whose tables are plain.
[theme.uses.blue]
like = "read"
table_look = "accent"

[theme.grounds]
"Inside" = "EAF0F8"
"Late" = "8B1E3F"

[checks]
stale_words = ["案件名", "第 N 回"]
unsourced = false
# The charts here exercise the outlined look, not their axes (= as the corpus's own workspace says).
unnamed_axis = false
# Its cards show every way an outlined card is filled, an untoned one among them (= as the corpus's own workspace says).
untoned_cards = false
