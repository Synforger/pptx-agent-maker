# A third made-up project, whose boxes are as tall as their words and whose body stands in the middle of the page
# (= `box_height = "middle"`). The main corpus keeps boxes as tall as their words at the top, and the outlined
# deck keeps boxes that take the page; the height of the boxes is one per project, so this look is kept here.

root = "."

[paths]
assets = "assets"

[theme]
box_height = "middle"

# A use of the project's own that puts its boxes back at the top, as tall as their words.
[theme.uses.topped]
like = "read"
box_height = "text"

[checks]
unsourced = false
# The pages here lay out how a box, a card or an arrow is placed, not what a deck says, so the checks of how much a
# page asks of a reader (= words, boxes of one line, parts, a lead that is not a picture) are off. They still stand
# for a real project: `tests/layout/test_page_checks.py` holds them to a page made to hit each.
wordy_page = false
one_line_boxes = false
crowded_page = false
no_lead = false
