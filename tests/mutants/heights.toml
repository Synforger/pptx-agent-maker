# How tall the bands are and how tall the boxes of one use are, and a body that stands in the middle of the page.

tests = ["tests/test_heights.py"]

# -- the band of a conclusion and the band of a condition (layout/base/tokens.py, layout/parts/page.py) -----------

[[mutant]]
name = "a use cannot write the height of a band"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = '"bar_gap", "row_gap", "band_height", "conclusion_height")'
new = '"bar_gap", "row_gap")'

[[mutant]]
name = "a height a use writes for the band over a page is cut from its type all the same"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = 'said["band_height"] if "band_height" in said else '
new = ""

[[mutant]]
name = "a height a use writes for the band under a page is not read"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = 'conclusion_height=said.get("conclusion_height", band),'
new = "conclusion_height=base.conclusion_height,"

[[mutant]]
name = "the band under a page, left unsaid, is not as tall as the one over it"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = 'conclusion_height=said.get("conclusion_height", band),'
new = 'conclusion_height=said.get("conclusion_height", base.conclusion_height),'

[[mutant]]
