# The roles a compose text can take: a figure set very large, lines of code set monospaced.

tests = ["tests/test_compose.py"]

[[mutant]]
name = "code is wrapped like any other words"
file = "src/pptx_agent_maker/write/pptx.py"
old = '"kicker_beside", "code"}'
new = '"kicker_beside"}'

[[mutant]]
name = "the face of a text of its own is ignored"
file = "src/pptx_agent_maker/write/pptx.py"
old = "run.font.name = element.family or theme.type.family"
