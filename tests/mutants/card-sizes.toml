# The size of a tag, the look of a table a use picks, and the single words of a card standing in the middle of their frame.

tests = ["tests/test_card_sizes.py"]

# -- the size of a tag (layout/base/tokens.py) -------------------------------------------------------------------

[[mutant]]
name = "a tag written under theme.type is not read"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "return self.heading if self.tag_set is None else self.tag_set"
new = "return self.heading"

[[mutant]]
name = "a tag left unsaid is the title and not the heading"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "return self.heading if self.tag_set is None else self.tag_set"
new = "return self.title if self.tag_set is None else self.tag_set"

[[mutant]]
