old = "bold=True, align=align, middle=alone))"
new = "bold=True, align=align))"

[[mutant]]
name = "a filled deck sets the words of a tag at the top again"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "alone = (middle or said.tag) and not (heading and body)"
new = "alone = middle and not (heading and body)"

