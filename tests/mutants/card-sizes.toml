# -- the look of a table a use picks (layout/base/tokens.py) -----------------------------------------------------

[[mutant]]
name = "the look of the tables a use writes is not read"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "                       table_look_set=_picked(said, \"table_look\", TABLE_LOOKS, \"the look of a table\", where),"
new = "                       table_look_set=None,"

[[mutant]]
name = "a look nobody pictured is let through as the look of a use's tables"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = 'table_look_set=_picked(said, "table_look", TABLE_LOOKS,'
new = 'table_look_set=_picked(said, "table_look", (*TABLE_LOOKS, "outlined", "filled", ""),'

[[mutant]]
name = "table_look is not a key a use may write"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = '_USE_KEYS = ("like", "floor", "spacing", "box_height", "table_look", "leading")'
new = '_USE_KEYS = ("like", "floor", "spacing", "box_height", "leading")'

[[mutant]]
name = "a use that says nothing takes the toolkit's look, not the deck's"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "table_look_set=sized.table_look_set or table_look,"
new = 'table_look_set=sized.table_look_set or "accent",'

[[mutant]]
name = "a look in another use keeps the look of the tables of the first"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "        table_look = type.table_look_set or self.table_look\n"
new = "        table_look = self.table_look\n"

[[mutant]]
name = "a look in another use is not given the look of its tables"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "box_height=box_height,\n                       table_look=table_look)"
new = "box_height=box_height)"

[[mutant]]
name = "a deck made in a use of its own does not take that use's look of tables"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "        table_look=type.table_look_set,\n"
new = "        table_look=table_look,\n"

# -- the single words of a card in the middle of their frame (layout/parts/page.py, write/pptx.py) --------------

[[mutant]]
name = "the words of a card with a heading and a body are set by the middle of a frame as well"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "alone = (middle or said.tag) and not (heading and body)"
new = "alone = middle or said.tag"

[[mutant]]
name = "the frame of single words is worked out from their height again"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "            if alone:\n                head = rest = inner\n"
new = "            if False:\n                head = rest = inner\n"

[[mutant]]
name = "the frame of single words is the whole box and not its inside"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "            if alone:\n                head = rest = inner\n"
new = "            if alone:\n                head = rest = card\n"

[[mutant]]
