# The title's band: as tall as the lines the title folds to, so the body starts below every one of them.

tests = ["tests/test_page.py", "tests/test_story.py"]

[[mutant]]
name = "a folded title takes the band of one line"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "folded = (lines - 1) * self.theme.line_height(t.title)"
new = "folded = 0"

[[mutant]]
name = "every folded line takes a line of the body's type, not of the title's"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "folded = (lines - 1) * self.theme.line_height(t.title)"
new = "folded = (lines - 1) * self.theme.line_height(t.body)"

[[mutant]]
name = "the small words above a title grow with the band"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "kick, main = clear.split_top(s.kicker_height)"
new = "kick, main = clear.rows([1, 2])"

[[mutant]]
name = "under the small words, the title's box stops where a band of one line would"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "kick, main = clear.split_top(s.kicker_height)"
new = "kick, main = Rect(clear.left, clear.top, clear.width, s.title_height).split_top(s.kicker_height)"

[[mutant]]
name = "the small words take a third of the band, whatever their own size"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "kick, main = clear.split_top(s.kicker_height)"
new = "kick, main = clear.split_top(s.title_height // 3)"

[[mutant]]
name = "a title is counted across the whole slide, margins included"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "room = right - left - 2 * s.text_inset\n"
new = "room = self.slide.width\n"

[[mutant]]
name = "a title is counted without the room its own box keeps at each side"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "room = right - left - 2 * s.text_inset\n"
new = "room = right - left\n"

[[mutant]]
name = "a title is counted in the light weight"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "needed = self.wraps(title, max(room, 1), self.type.title, bold=True)"
new = "needed = self.wraps(title, max(room, 1), self.type.title, bold=False)"
