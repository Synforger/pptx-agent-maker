# A compose page sets the gap across a row and the gap down apart (`gap_x`, `gap_y`; unsaid, both follow `gap_m`), a
# cell of no words takes no height and draws nothing, a picture is ruled at shares of its height (`guides`,
# `guide_tone`), and the share of a row, a cell or a stage is read in one place.

tests = ["tests/layout/test_compose_gaps.py", "tests/layout/test_compose.py", "tests/layout/test_roadmap.py", "tests/layout/test_uses.py"]

