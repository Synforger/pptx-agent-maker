# A roadmap whose stages may leave their `nodes` out: the arrowheads stand alone, and a flow still wants its nodes.

tests = ["tests/test_roadmap.py"]

[[mutant]]
name = "a roadmap asks for the nodes of every stage again"
file = "src/pptx_agent_maker/layout/types/bodies/roadmap.py"
old = '"roadmap", bare=True)'
new = '"roadmap")'

[[mutant]]
name = "a flow lets a stage go without nodes"
