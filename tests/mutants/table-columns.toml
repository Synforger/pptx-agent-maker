# A table's columns can be given a ratio (= `table_columns`): the table is laid out and counted at the widths
# the ratio gives, in a cell and under a body alike, and a ratio that does not fit the table stops.

tests = ["tests/layout/test_table_columns.py", "tests/layout/test_table_widths.py"]

[[mutant]]
name = "the ratio is left to the words of the columns"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "            return self.shared_widths(shares, total)"
new = "            pass"

[[mutant]]
name = "the last column does not take what rounding leaves"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "        return widths + [total - sum(widths)]"
new = "        return widths + [round(total * shares[-1] / whole)]"

