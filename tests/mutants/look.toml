# The four looks, from the one place that reads them to every part that paints them,
# and the timeline's three steps (read, measure, place).

tests = ["tests/test_look.py", "tests/test_timeline.py", "tests/test_roadmap.py", "tests/test_flow.py",
         "tests/test_grounds.py", "tests/test_compose.py"]

# -- the one reader (layout/types/core/read.py) --------------------------------

[[mutant]]
name = "a tone that was written is dropped for the part's default"
file = "src/pptx_agent_maker/layout/types/core/read.py"
old = 'read_tone(spec, item, what, unsaid) if "tone" in item else unsaid'
new = "unsaid"

[[mutant]]
name = "an icon that was written is not read"
file = "src/pptx_agent_maker/layout/types/core/read.py"
old = 'else unsaid, _icon(spec, item, what),'
new = 'else unsaid, None,'

[[mutant]]
name = "tentative is not read"
file = "src/pptx_agent_maker/layout/types/core/read.py"
old = 'tentative=_flag(item, "tentative", what)'
new = "tentative=False"

[[mutant]]
name = "strong is not read"
file = "src/pptx_agent_maker/layout/types/core/read.py"
old = 'strong=_flag(item, "strong", what)'
new = "strong=False"

[[mutant]]
name = "a card written as a table loses its looks"
file = "src/pptx_agent_maker/layout/types/core/read.py"
old = 'str(item.get("body", "")), read_style(spec, item, what, TONES[0]))'
new = 'str(item.get("body", "")))'

