# Lifting into a template keeps the template as it was, for the last few lifts only, and adds
# its stand-in words to the template's stale_words however the person wrote that array.

tests = ["tests/project/test_lift.py"]

[[mutant]]
name = "every copy ever made is kept"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = "    for old in copies[:-KEPT]:"
new = "    for old in []:"

[[mutant]]
name = "whatever sits in the archive is counted as a copy, and removed"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = "                    if path.is_dir() and _COPY.fullmatch(path.name))"
new = "                    if path.is_dir())"

[[mutant]]
name = "the oldest copies are the ones kept"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = "    for old in copies[:-KEPT]:"
new = "    for old in copies[KEPT:]:"

[[mutant]]
name = "an array on many lines is folded onto its last line"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = '    if "\n" not in text[start:end]:  # 1 行の配列 (= 語は同じ行に続ける)'
new = "    if True:"

[[mutant]]
name = "no comma is put after the array's last word"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = '        head = head[:last] + "," + head[last:]'
new = "        pass"

[[mutant]]
name = "a comment in the array is read as words"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = '        if char == "#":'
new = "        if False:"

[[mutant]]
name = "an escaped quote ends the word"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = """                at += 2 if char == '"' and text[at] == "\\\\" else 1"""
new = "                at += 1"

[[mutant]]
name = "words that did not land in [checks] are written anyway"
file = "src/pptx_agent_maker/project/commands/lift.py"
old = "    if landed != current + added:"
new = "    if False:"
