# What people said, each in a speech bubble with who said it under its tail (= `voices` in a compose cell).

tests = ["tests/test_compose.py"]

[[mutant]]
name = "the voices stand one to a row whatever the width"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "        most = max(1, min(len(voices), (width + gap) // (VOICE_WIDTH + gap)))\n"
new = "        most = 1\n"

[[mutant]]
name = "the rows are not evened (= six stand as five and one)"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "        across = -(-len(voices) // -(-len(voices) // most))\n"
new = "        across = most\n"

[[mutant]]
name = "each bubble is as tall as its own words, not as the tallest of its row"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "            bubble = max(self.theme.wrapped_height(voice.text, room) for voice in row) + 2 * s.pad\n"
new = "            bubble = self.theme.wrapped_height(row[0].text, room) + 2 * s.pad\n"

[[mutant]]
name = "who said it is left out"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "                if voice.who:\n"
new = "                if False:\n"

[[mutant]]
name = "a voice is drawn as a plain box"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = 'align="left", shape="voice"))'
new = 'align="left"))'

[[mutant]]
name = "the tone a voice asks for is ignored"
file = "src/pptx_agent_maker/layout/types/bodies/compose.py"
old = 'Style(read_tone(spec, item, where, "box") if "tone" in item else "box")'
new = 'Style("box")'

[[mutant]]
name = "voices that do not fit are let through"
file = "src/pptx_agent_maker/layout/types/bodies/compose.py"
old = 'part in ("card", "panel", "text", "points", "voices", "tree"):'
new = 'part in ("card", "panel", "text", "points", "tree"):'

[[mutant]]
name = "the tail is left where the preset puts it"
file = "src/pptx_agent_maker/write/pptx.py"
