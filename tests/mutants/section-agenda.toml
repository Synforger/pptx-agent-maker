new = ""

[[mutant]]
name = "a length that is not a number of pages is taken"
file = "src/pptx_agent_maker/checks/declared/section_agenda.py"
old = "    if isinstance(said, bool) or not isinstance(said, int) or said < 1:"
new = "    if False:"

[[mutant]]
