# A long chapter of several parts comes back to its agenda at the head of each part.

tests = ["tests/checks/test_section_agenda.py"]

[[mutant]]
name = "a chapter as long as the limit is said too"
file = "src/pptx_agent_maker/checks/declared/section_agenda.py"
old = "if chapter[\"parts\"] < 2 or chapter[\"pages\"] <= long:"
new = "if chapter[\"parts\"] < 2 or chapter[\"pages\"] < long:"

[[mutant]]
name = "a chapter of one part is said too"
file = "src/pptx_agent_maker/checks/declared/section_agenda.py"
old = "if chapter[\"parts\"] < 2 or chapter[\"pages\"] <= long:"
new = "if chapter[\"pages\"] <= long:"

[[mutant]]
name = "one agenda in the chapter is taken for all its parts"
file = "src/pptx_agent_maker/checks/declared/section_agenda.py"
old = "        if missing:\n"
new = "        if len(missing) == chapter[\"parts\"]:\n"

[[mutant]]
name = "the agendas are counted as pages of the chapter"
file = "src/pptx_agent_maker/checks/declared/section_agenda.py"
old = "                current[\"marked\"].add(item)\n            continue\n"
new = "                current[\"marked\"].add(item)\n            current[\"pages\"] += 1\n            continue\n"

[[mutant]]
