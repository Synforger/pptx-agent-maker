# A project that points at a template: what it takes from the template, and what it may not lay over it.

tests = ["tests/project/test_project.py"]

[[mutant]]
name = "a use of the template's name is laid over it key by key"
file = "src/pptx_agent_maker/project/files/workspace.py"
old = "            _refuse_shared_uses(path, template, inherited, data)\n"
new = ""

[[mutant]]
name = "the uses of a template are read as none"
file = "src/pptx_agent_maker/project/files/workspace.py"
old = "    shared = sorted(_uses_of(inherited) & _uses_of(data))"
new = "    shared = sorted(_uses_of({}) & _uses_of(data))"

[[mutant]]
name = "every use of a project is refused"
file = "src/pptx_agent_maker/project/files/workspace.py"
old = "    shared = sorted(_uses_of(inherited) & _uses_of(data))"
new = "    shared = sorted(_uses_of(inherited) | _uses_of(data))"
