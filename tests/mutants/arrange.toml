# Arrangements in a compose cell: a ring, a tree, circles that overlap, and the pictures with marks on them. The arrows between
# cells are in link-routes.toml.

tests = ["tests/layout/test_arrange.py"]

[[mutant]]
name = "the ring goes round anticlockwise"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "round(cx + rx * math.sin(2 * math.pi * i / count))"
new = "round(cx - rx * math.sin(2 * math.pi * i / count))"

[[mutant]]
name = "the last box of a ring is not joined back to the first"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "after = boxes[(number + 1) % len(boxes)]"
new = "after = boxes[min(number + 1, len(boxes) - 1)]"

[[mutant]]
name = "ring boxes are let touch"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "if _apart(boxes, s.gap_l):"
new = "if True:"

[[mutant]]
name = "the ring's arrows run into the boxes"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "leave, enter = _exit(a, dx, dy), 1 - _exit(b, -dx, -dy)"
new = "leave, enter = 0.0, 1.0"

[[mutant]]
name = "a parent is not centred over its children"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "here = Rect(left + (right - left - box) // 2, tops[depth], box, heights[depth])"
new = "here = Rect(left, tops[depth], box, heights[depth])"

[[mutant]]
name = "a tree any depth is let through"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "if children and depth >= DEPTH:"
new = "if False:"

[[mutant]]
name = "a tree too wide to read is let through"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "    if box < floor:"
new = "    if False:"

[[mutant]]
name = "overlapping circles are solid"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "page.circle(circle, tone, clear=CLEAR)"
new = "page.circle(circle, tone)"

[[mutant]]
name = "a circle's name is set in the middle of its circle"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "x, y = cx + dx / reach * away, cy + dy / reach * away"
new = "x, y = cx, cy"

[[mutant]]
name = "every name of a mark goes in the right column"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = 'sides = {"left": [m for m in marks if m[0] < 0.5], "right": [m for m in marks if m[0] >= 0.5]}'
new = 'sides = {"left": [], "right": list(marks)}'

[[mutant]]
name = "names of crowded marks are piled on each other"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "tops[i] = max(round(point - heights[i] / 2), below)"
new = "tops[i] = max(round(point - heights[i] / 2), rect.top)"

[[mutant]]
name = "the line of a mark stops short of its point"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "point = (round(placed.left + x * placed.width), round(placed.top + y * placed.height))"
new = "point = (round(placed.left + x * placed.width), round(placed.top + y * placed.height / 2))"

[[mutant]]
name = "a marked picture floats in the middle of its cell"
file = "src/pptx_agent_maker/layout/types/bodies/arrange.py"
old = "tall = min(round((right - left) / aspect) + named, rect.height)"
new = "tall = rect.height"
