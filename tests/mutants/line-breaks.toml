# A line break in a name is a line of its own wherever a name is written: the marks, dates and periods of a timeline
# count the lines they are written in, and the words of a speech bubble are a paragraph to each line.

tests = ["tests/layout/test_line_breaks.py"]

# -- the words of a speech bubble -----------------------------------------------

[[mutant]]
name = "the words of a speech bubble are written as one run, breaks and all"
file = "src/pptx_agent_maker/write/pptx.py"
old = "    _name_lines(frame, element, theme, bold=None)\n"
new = '''    paragraph = frame.paragraphs[0]
    paragraph.alignment = ALIGN[element.align]
    run = paragraph.add_run()
    run.text = element.text
    run.font.size = Pt(element.size)
    run.font.color.rgb = _colour(element.colour)
    run.font.name = theme.type.family
'''

[[mutant]]
name = "a speech bubble is as tall as one line whatever it is written in"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "bubble = max(self.theme.wrapped_height(voice.text, room) for voice in row) + 2 * s.pad"
new = "bubble = self.theme.line_height() + 2 * s.pad"

