# A roadmap whose stages may say `weight`: the columns are cut by it, and the nodes under a stage break over their own column.

tests = ["tests/test_roadmap.py"]

[[mutant]]
name = "the columns of a road are cut equally whatever the stages weigh"
file = "src/pptx_agent_maker/layout/types/bodies/roadmap.py"
old = "columns = area.columns(weights, gap=s.gap_m)"
new = "columns = area.columns(len(stages), gap=s.gap_m)"

[[mutant]]
name = "a stage may not say its weight"
