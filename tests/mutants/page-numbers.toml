new = "counted = \"\""

# ---- review, titles and the failures of a build name their pages the same way ----

[[mutant]]
name = "a deck to import that is not there is named by a bare page number"
file = "src/pptx_agent_maker/deck/build.py"
old = "f\"{manifest_page_label(index)}: deck to import"
new = "f\"page {index}: deck to import"

[[mutant]]
name = "a picture or table that cannot be swapped in is named by a bare page number"
file = "src/pptx_agent_maker/deck/build.py"
old = "    except (ValueError, WorkspaceError) as reason:\n        raise ManifestError(f\"{manifest_page_label(index)}: {reason}\") from reason"
new = "    except (ValueError, WorkspaceError) as reason:\n        raise ManifestError(f\"page {index}: {reason}\") from reason"

[[mutant]]
name = "a declared page that cannot be built is named by a bare page number"
file = "src/pptx_agent_maker/deck/build.py"
old = "    except (ValueError, KeyError, WorkspaceError, PageFullError) as reason:\n        raise ManifestError(f\"{manifest_page_label(index)}: {reason}\") from reason"
new = "    except (ValueError, KeyError, WorkspaceError, PageFullError) as reason:\n        raise ManifestError(f\"page {index}: {reason}\") from reason"

[[mutant]]
name = "a failure while building does not say it is the manifest's page"
