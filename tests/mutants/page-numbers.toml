# A report names a page the way the person reading the deck counts it: its place in the file, and the number printed when that differs.

tests = ["tests/checks/test_page_numbers.py"]

[[mutant]]
name = "a deck counted from one is given a printed number too"
file = "src/pptx_agent_maker/_common/page_label.py"
old = "if first_number == 1 or page < 1:"
new = "if page < 1:"

[[mutant]]
name = "the whole deck is given a printed number"
file = "src/pptx_agent_maker/_common/page_label.py"
old = "if first_number == 1 or page < 1:"
new = "if first_number == 1:"

[[mutant]]
name = "the printed number is one too many"
file = "src/pptx_agent_maker/_common/page_label.py"
old = "return f\"{page} (printed {first_number + page - 1})\""
new = "return f\"{page} (printed {first_number + page})\""

