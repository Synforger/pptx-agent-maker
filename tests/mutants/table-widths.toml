# A table's width is shared by what each column's longest cell needs on one line, and its rows are counted by
# where the words really break.

tests = ["tests/test_table_widths.py", "tests/test_table_plain.py", "tests/test_types.py"]

[[mutant]]
name = "the columns are shared by the number of characters again"
file = "src/pptx_agent_maker/layout/base/tokens.py"
old = "        want = [max((self.width(str(row[i]), bold=row is heading) if i < len(row) else 0) for row in rows) + pad"
new = "        want = [max((len(str(row[i])) if i < len(row) else 0) for row in rows) + pad"

[[mutant]]
