# Words reach the contrast floor their size and weight ask for on every ground the toolkit paints, and a
# template's brand pairs pass the contrast check by name — and are said in the report.

tests = ["tests/checks/test_readable_colours.py"]

# -- the words' colour (= layout/tokens.py) ------------------------------

[[mutant]]
name = "words short of the floor stay as they are"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "            for step in range(self.STEPS + 1):"
new = "            for step in range(1):"

[[mutant]]
name = "only the better of the ink and the paper is moved"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "        for colour in ranked:"
new = "        for colour in ranked[:1]:"

[[mutant]]
name = "words short of the floor go all the way to black or white"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "                moved = _towards(colour, end, step / self.STEPS)"
new = "                moved = _towards(colour, end, 1 if step else 0)"

[[mutant]]
name = "the words are moved only to the large type's floor"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "                if contrast(ground, moved) >= floor:"
new = "                if contrast(ground, moved) >= READABLE_LARGE:"

[[mutant]]
name = "words of any size take the normal floor"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "        floor = reading_floor(points, bold)\n"
new = "        floor = READABLE\n"

[[mutant]]
name = "bold words of 14pt are counted as normal"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "    large = points is None or points >= LARGE_SIZE or (bold and points >= LARGE_BOLD)"
new = "    large = points is None or points >= LARGE_SIZE"

[[mutant]]
name = "bold words must pass 14pt to be large"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "(bold and points >= LARGE_BOLD)"
new = "(bold and points > LARGE_BOLD)"

[[mutant]]
name = "words of 18pt must pass 18pt to be large"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "points >= LARGE_SIZE or"
new = "points > LARGE_SIZE or"

[[mutant]]
name = "words without a size are counted as normal"
file = "src/pptx_agent_maker/layout/tokens.py"
old = "    large = points is None or points >= LARGE_SIZE or (bold and points >= LARGE_BOLD)"
new = "    large = points is not None and (points >= LARGE_SIZE or (bold and points >= LARGE_BOLD))"

[[mutant]]
name = "the check counts words by its own sizes"
file = "src/pptx_agent_maker/checks/rules/contrast.py"
old = "reading_floor(points, bool(BOLD.search(properties.group(0))))"
new = "reading_floor(points, False)"

