# Words on a ground the project coloured take the colour that reads on it.

tests = ["tests/layout/test_readable_grounds.py"]

[[mutant]]
name = "a table's heading row keeps white words on any accent"
file = "src/pptx_agent_maker/write/pptx.py"
old = "            ink = theme.palette.words_on(ground, theme.type.body, heading)\n"
new = "            ink = theme.palette.paper if heading else theme.palette.ink\n"

[[mutant]]
name = "a box on the accent keeps white words"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = "        words = p.words_on(fill, self.theme.type.body if points is None else points, bold)\n"
new = "        words = p.paper if tone in TONES else p.words_on(fill, self.theme.type.body)\n"

[[mutant]]
name = "a timeline's period keeps white words"
file = "src/pptx_agent_maker/layout/parts/page.py"
old = 'p.words_on(p.accent, size, True),'
new = 'p.paper,'

