# One deck. `specimen` and `deck` paths are relative to the project root.
#
# A page is made in one of three ways and nothing else:
#   copy     — duplicate the specimen's Nth page and swap words
#   import   — bring in the Nth page of a deck built earlier
#   declare  — build it from a recipe in pages/
#
# The order here is the order the deck reads. A page left out of this file does
# not exist in the built deck.

specimen = "base/specimen.pptx"
out = "example.pptx"

[[pages]]
kind = "copy"
page = 1
replace = [["旧いタイトル", "新しいタイトル"]]
note = "表紙は型見本から複製して文言だけ差し替える"

[[pages]]
kind = "declare"
module = "example_page"
note = "この案件の頁 (= pages/example_page.py の build(workspace))"

