# <project> — where this deck project keeps its things.
#
# The toolkit reads this file and nothing else to find them. It must sit outside
# the toolkit's repository: anything in here is the project's, and the project's
# data never belongs in a push.
#
# A built deck sits beside the manifest that describes it, so `w1.toml` and
# `w1.pptx` are neighbours. Only the material is filed away, one folder per round.

root = "."

[paths]
assets = "assets"       # images and other material, one folder per round

# The project's own look is read from specimen.pptx — its master carries the
# typeface and the colours, and every page built from a type comes out in them.
#
# This block is the exception on top: write it only where the specimen's palette
# does not line up with what the toolkit means by each colour (the one that marks
# a reading, the strip behind a stated condition). Whatever is written here wins;
# everything else stays as the specimen has it.
#
# [theme]
# font = "Arial"
#
# [theme.palette]
# accent = "0092D1"     # the colour that marks a reading (= also the table header)
#
# How large the type is follows from what the deck is for. Left unsaid it is a deck
# to be read at a desk; a deck shown on a screen is set larger throughout, and holds less.
#
# [theme]
# use = "present"       # "read" (the default), "present" or "sheet"
# kicker = "beside"     # the small words of a title: "above" it (the default), or "beside" it on its line
#
# [theme.type]          # a size of the project's own, role by role, in points
# body = 20             # title / heading / stage / body / caption
#
# A deck may name a use of its own (use = "read" at the top of its manifest), and so may one
# page inside it (use = "read" on the page): a page packed to be read, in the middle of a deck
# made to be shown. They pick a use by name; the sizes themselves are written only here.
#
# A page read on one sheet of paper (a proposal on one page, a page of details) is use = "sheet":
# its type is smaller and what stands round the type is tightened by the same ratio. Not for a
# page that is shown and spoken to.
#
# [theme.uses.detail]   # a use of the project's own, picked with use = "detail"
# like = "read"         # which of the toolkit's uses it starts from: "read", "present" or "sheet"
# body = 11             # and the sizes it changes
# floor = 8             # a floor of its own under its type, in points
#
# [theme.uses.detail.spacing]
# scale = 0.6           # its spacing, as a ratio of a deck to be read...
# pad = 0.15            # ...or a distance by itself, in cm (the reference lists them)

# Words the specimen leaves behind. A copied page that still says one of these
# was never reworded, and the check after the build stops it.
[checks]
stale_words = ["案件名", "第 N 回"]
