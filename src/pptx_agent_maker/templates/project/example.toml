# One deck. A page is made in one of three ways and nothing else:
#
#   copy     — duplicate the specimen's Nth page and swap words
#   import   — bring in the Nth page of a deck built earlier
#   declare  — build it from one of the page types
#
# The order here is the order the deck reads. A page left out of this file does
# not exist in the built deck.
#
# Material comes from `assets/<this file's name>/` unless `assets` says otherwise.

specimen = "specimen.pptx"
out = "example.pptx"

[[pages]]
kind = "copy"
page = 1
replace = [["案件名", "見本の案件"], ["第 N 回 進捗報告", "第 1 回 進捗報告"]]
why = "表紙はテンプレートから複製して文言だけ差し替える"

[[pages]]
kind = "declare"
type = "agenda"
title = "目次"
buckets = [["見本", ["型の選び方", "カードと読み方", "グラフと表"]]]
highlight = 1
why = "資料には目次の頁を 1 枚置く (= 目次が 1 枚も無い資料は、検査 section_agenda が止める)"

[[pages]]
kind = "declare"
type = "figure"
kicker = "01 | 見本"
title = "型を選べば、頁の割り方は決まっている"
condition = "この頁で固定した条件を 1 行"
figure = "example.png"
caption = "図の読み方を 1 行"
conclusion = "読み手に持ち帰ってほしい 1 行"
footer = "出所 (= どの run のどの表から来たか)"
why = "型で書ける頁は型で書く (= 頁の割り方を頁ごとに決めない)"

[[pages]]
kind = "declare"
type = "figure"
kicker = "01 | 見本"
title = "カードと読み方は、どの型にも添えられる"
cards = [["① 一つめ", "カードは本体の上に並ぶ"], ["② 二つめ", "読み方は本体の下"]]
figure = "example.png"
note = "図の読み方を 1 行"
footer = "出所 (= この頁の図の出どころ)"
why = "1 頁に全部は載せない (= 映す資料は字が大きく、載る量が減る。収まらない頁は縮まずに止まる)"

[[pages]]
kind = "declare"
type = "chart"
kicker = "01 | 見本"
title = "グラフが主役の頁に、表を下から添える"
chart = { kind = "column", y = "件数", categories = ["前回", "今回"], series = [{ name = "件数", values = [3, 5] }] }
table = [["列", "値"], ["前回", "3"], ["今回", "5"]]
footer = "出所 (= このグラフの数字の出どころ)"
why = "表は主役にしない (= 主役は絵かグラフで、表はその数字を添える)"

