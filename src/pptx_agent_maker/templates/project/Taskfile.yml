version: '3'

# この案件のデッキを組む口。
#
# ツールそのものは `pptx-agent-maker` で、ここに在るのは**その呼び出しだけ** (= 案件の中に
# ツールは入らない)。この file 1 枚で folder が完結する ― ツールがどの python に入っているかを
# 覚えていなくても、ここで task を叩けば焼ける。
#
# ツールを別名で呼びたいときは `MAKER=...` で上書きする。

vars:
  MAKER: '{{.MAKER | default "pptx-agent-maker"}}'

tasks:
  default:
    desc: Show what can be done in this project
    cmds:
      - task --list

  build:
    desc: Build a deck from its manifest and check it (= task build -- w1)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} build . {{.CLI_ARGS}}'

  check:
    desc: Read a built deck back and report what it found (= task check -- w1.pptx)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} check . {{.CLI_ARGS}}'

  review:
    desc: Show what a person changed in a built deck, or take it in (= task review -- w1.pptx --apply)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} review . {{.CLI_ARGS}}'

  preview:
    desc: Watch this project's built decks in a browser
    deps: [_tool]
    cmds:
      - '{{.MAKER}} preview .'

  refresh:
    desc: Take the tasks and the skill of the toolkit installed now (= after updating it)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} refresh .'

  types:
    desc: List the page types, the keys each reads, and this project's recipes
    deps: [_tool]
    cmds:
      - '{{.MAKER}} types .'

  round:
    desc: Start the next round from the one before (= task round -- w2 --from w1)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} round . {{.CLI_ARGS}}'

  lift:
    desc: Lift recipes and pages into the company template, the project taken out (= task lift -- <template> --page w1.pptx:3 --keep "Header")
    deps: [_tool]
    cmds:
      - '{{.MAKER}} lift . {{.CLI_ARGS}}'

  promote:
    desc: Keep a page written the same way twice as a recipe (= task promote -- result w1:5 w2:7)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} promote . {{.CLI_ARGS}}'

  show:
    desc: Say where this project keeps its things (= task show -- w1.pptx:12 lists one page's pictures and tables)
    deps: [_tool]
    cmds:
      - '{{.MAKER}} show . {{.CLI_ARGS}}'

  _tool:
    internal: true
    preconditions:
      - sh: command -v {{.MAKER}} >/dev/null 2>&1
        msg: |
          {{.MAKER}} is not on PATH, so nothing here can be built.

          The toolkit lives outside this folder and is installed once per machine:
            pipx install <the pptx-agent-maker checkout>
          Nothing in this project needs to change — it never contains the toolkit.
