name: CI

# Mirror of the local gate suite — the checks themselves live in the
# Taskfile / .tooling and run offline; this workflow only gives GitHub
# a trigger to run the same `task ci` on pull requests, so external
# contributors get a status check without owning the guard machinery.
#
# Visibility guard: public-repo runner minutes are free; on a private
# repository this workflow refuses to run so it can never consume the
# plan's minute quota. Local gates remain the source of truth there.
#
# LibreOffice is not installed here: it is 89 MB from a mirror that is slow on some runs, and the three tests
# that convert a deck for real skip without it. They run on the machine that runs `task ci` before a commit.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the docs gate resolves references against history
      - name: Install go-task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install uv
        # Every gate runs through `uv run`, which builds the environment from
        # .python-version and uv.lock the first time it is called.
        uses: astral-sh/setup-uv@v10.2.0
      - name: Run the local gate suite
        run: task ci
