[project]
name = "pptx-agent-maker"
version = "0.9.3"
description = "Build slide decks by declaring structure, not coordinates."
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0"]

# 案件の folder から名前で呼べるようにする。`python -m ...` だけだと、ツールが
# どの python に入っているかを人が覚えていないと 1 頁も焼けない。
[project.scripts]
pptx-agent-maker = "pptx_agent_maker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# プロジェクトテンプレートはツールの一部として配る (= これが無いと、入れたツールの `init` が落ちる)。
[tool.setuptools.package-data]
pptx_agent_maker = ["templates/project/**/*", "templates/project/.gitignore",
                    "templates/project/.claude/**/*"]
pptx_live_preview = ["assets/*"]

# プレビューもツールと一緒に入れる (= `preview/` は自分の pyproject を持つ別の package だが、
# 入れ方を 2 つ覚えさせない。これが無いと、checkout の外に入れたツールの `preview` が落ちる)。
[tool.setuptools.packages.find]
where = ["src", "preview/src"]
