[project]
name = "pptx-agent-maker"
version = "0.9.3"
description = "Build slide decks by declaring structure, not coordinates."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["python-pptx>=1.0"]

# `uv run` / `uv sync` が既定で入れる group。プレビューは下の packages.find が本体と一緒に入れるので、
# ここに足すのは試験 (pytest と 1 本ごとの上限の pytest-timeout) と sdist / wheel を組む build だけ。
[dependency-groups]
dev = ["pytest>=7", "pytest-timeout>=2", "build"]

# 本体 (tests/) とプレビュー (preview/tests/) の両方の試験がこの 1 か所を読む。
# 1 本が止まると全体が終わらず、流した側は気づかずに待ち続けるので、1 本ごとに上限を置き、
# 遅い 10 本の名前を毎回出す (= 遅くなった 1 本がその場で名指される)。
[tool.pytest.ini_options]
# 普段一番遅い 1 本 (= 約 4 秒) の 3 倍
timeout = 12
addopts = "--durations=10"

# 案件の folder から名前で呼べるようにする。`python -m ...` だけだと、ツールが
# どの python に入っているかを人が覚えていないと 1 頁も焼けない。
[project.scripts]
pptx-agent-maker = "pptx_agent_maker.__main__:main"
pptx-live-preview = "pptx_live_preview.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# プロジェクトテンプレートはツールの一部として配る (= これが無いと、入れたツールの `init` が落ちる)。
[tool.setuptools.package-data]
pptx_agent_maker = ["templates/project/**/*", "templates/project/.gitignore",
                    "templates/project/.claude/**/*"]
pptx_live_preview = ["assets/*"]

# プレビューもツールと一緒に入れる (= `preview/` は自分の pyproject を持つ別の package だが、
# 入れ方を 2 つ覚えさせない。これが無いと、checkout の外に入れたツールの `preview` が落ちる)。
[tool.setuptools.packages.find]
where = ["src", "preview/src"]
