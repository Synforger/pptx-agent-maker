[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-live-preview"
version = "0.0.0"
description = "Live-reloading local preview for PowerPoint decks: save the pptx, see it re-render in the browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Synforger" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pptx-live-preview = "pptx_live_preview.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pptx_live_preview = ["assets/*"]
